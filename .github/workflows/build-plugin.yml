name: Build unRAID Plugin

# Builds the scrub-rs binary (gnu target, matching unRAID's glibc runtime)
# and packages it into the unRAID plugin .txz bundle. craft-corrupt — the
# dangerous test-only corruption injector — is deliberately NOT built or
# shipped here: it exists only for the CI test array in scrub-rs-tests.yml.
# The Rust test suite lives in scrub-rs-tests.yml;
# this workflow is
# intentionally independent so a packaging change can't be blocked by the
# (slower) integration tests, but it runs the unit tests itself as a cheap
# gate before shipping.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    name: Build binaries + package plugin
    timeout-minutes: 30
    # contents: write is required so the tag-triggered release step can
    # publish the .txz bundle via the default GITHUB_TOKEN, regardless of
    # the repo's default workflow-permission setting.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Unit tests (cheap gate before packaging)
        run: |
          cd scrub-rs
          cargo test --locked --release

      - name: Runner notification and shutdown regressions
        run: python3 tests/notifications_test.py

      - name: Build scrub-rs (gnu)
        run: |
          cd scrub-rs
          # Only scrub-rs is built for the plugin. craft-corrupt is a
          # dangerous test-only utility and must never be built or shipped
          # here — it is built only by scrub-rs-tests.yml for the test array.
          cargo build --locked --release --bin scrub-rs
          ls -l target/release/scrub-rs

      - name: Stage binaries into plugin tree
        run: |
          BIN_DIR="plugins/source/rotshield/usr/local/emhttp/plugins/rotshield/bin"
          mkdir -p "$BIN_DIR"
          cp scrub-rs/target/release/scrub-rs "$BIN_DIR/"
          chmod 755 "$BIN_DIR/scrub-rs"
          # Guard: craft-corrupt must never be staged or bundled with the
          # plugin, even if a stale copy ends up in the tree.
          if [ -e "$BIN_DIR/craft-corrupt" ]; then
            echo "::error::craft-corrupt found in the plugin bin dir — refusing to package"
            exit 1
          fi
          file "$BIN_DIR/scrub-rs"

      - name: Record scanner build provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('plugins/source/rotshield/usr/local/emhttp/plugins/rotshield')
          binary = root / 'bin/scrub-rs'
          info = {
              'source_commit': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'scanner_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'rustc': subprocess.check_output(['rustc', '--version', '--verbose'], text=True).strip(),
              'build_command': 'cargo build --locked --release --bin scrub-rs',
              'test_array_feature_enabled': False,
          }
          (root / 'build-info.json').write_text(json.dumps(info, indent=2, sort_keys=True) + '\n')
          PY

      - name: Package bundle (.txz)
        run: |
          cd plugins/source/rotshield
          bash pkg_build.sh
          ls -l ../../archive/

      - name: Generate SHA-256-pinned release manifest
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, shutil, xml.etree.ElementTree as ET
          source = pathlib.Path('plugins/rotshield.plg').read_text()
          version = re.search(r'<!ENTITY version\s+"([^"]+)">', source).group(1)
          archive = pathlib.Path('plugins/archive')
          bundle = archive / f'rotshield-{version}-x86_64-1.txz'
          digest = hashlib.sha256(bundle.read_bytes()).hexdigest()
          manifest, count = re.subn(r'<!ENTITY sha256\s+"[^"]*">', f'<!ENTITY sha256 "{digest}">', source)
          assert count == 1
          parsed = ET.fromstring(manifest)
          package = next(item for item in parsed.findall('FILE') if item.find('SHA256') is not None)
          assert package.findtext('SHA256') == digest
          assert package.findtext('URL').endswith('/' + bundle.name)
          (archive / 'rotshield.plg').write_text(manifest)
          shutil.copyfile('plugins/source/rotshield/usr/local/emhttp/plugins/rotshield/build-info.json', archive / 'build-info.json')
          assets = [bundle.name, 'rotshield.plg', 'build-info.json']
          (archive / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256((archive / name).read_bytes()).hexdigest() + '  ' + name + '\n'
              for name in assets))
          print(f'Pinned {bundle.name}: {digest}')
          PY

      - name: Verify release tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/.*<!ENTITY version[[:space:]]*"\([^"]*\)".*/\1/p' plugins/rotshield.plg | head -1)
          echo "plugin version: $VERSION"
          echo "release tag:    ${GITHUB_REF_NAME}"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match the .plg version (v${VERSION}); the .plg's bundleURL would 404"
            exit 1
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotshield-bundle
          path: |
            plugins/archive/*.txz
            plugins/archive/rotshield.plg
            plugins/archive/build-info.json
            plugins/archive/SHA256SUMS
          if-no-files-found: error

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugins/archive/*.txz
            plugins/archive/rotshield.plg
            plugins/archive/build-info.json
            plugins/archive/SHA256SUMS
          prerelease: true
          body: |
            Personal RotShield build from ${{ github.sha }}. Retains upstream attribution.
            Install rotshield.plg from these release assets, not the source template.
            Existing configuration is preserved; installing does not enable repair.
            The update URL is pinned to this release; subsequent upgrades are manual.
          # Auto-generate release notes from the conventional commits since
          # the last release. The asset is named after the .plg version
          # (pkg_build.sh derives it from the plg) and the verification step
          # above ensures the tag matches, so the .plg's bundleURL
          # (.../releases/download/v<version>/<versioned asset>) resolves.
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
